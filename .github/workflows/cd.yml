name: CD

# Deployment is intentionally simple: build the single backend image, push
# it to GHCR, and build the Android APK via EAS. There is no
# cd-staging/cd-production split with Kubernetes rollouts here — no
# orchestration target was decided in the approved architecture docs
# (Kubernetes was explicitly out of scope for MVP, see
# docs/architecture/16_ADR_PACK.md). The final "deploy" step is a
# placeholder until a hosting target is chosen.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push-backend:
    name: Build and push backend image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # PLACEHOLDER: no hosting target has been chosen for the backend yet
      # (open question — see docs/architecture/16_ADR_PACK.md). Once one is
      # picked (a single VM, a PaaS, etc.), replace this step with the real
      # deploy command. Intentionally not a Kubernetes rollout — that
      # decision was explicitly deferred.
      - name: Deploy (placeholder)
        run: |
          echo "No deployment target configured yet."
          echo "Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "Replace this step with a real deploy (e.g. SSH + docker compose pull && up -d) once a host is chosen."

  build-android-apk:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      # Direct-APK-install distribution (no Play Store pipeline for MVP),
      # per docs/architecture/13_FRONTEND_DASHBOARD_PLAN.md §8 and the
      # hackathon APK-first target referenced in source §28.
      - name: Build Android APK
        working-directory: frontend
        run: eas build --platform android --profile preview --non-interactive --no-wait
