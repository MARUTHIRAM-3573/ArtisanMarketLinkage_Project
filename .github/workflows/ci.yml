name: CI

# Runs on every push/PR. Builds and tests the backend (single Spring Boot
# deployable, per ADR-1) and the frontend (React Native + Expo, per ADR-4).
# There is no per-service matrix here — the modular monolith is one Maven
# reactor build, not N independent microservice builds.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: artisan_marketplace
          POSTGRES_USER: artisan
          POSTGRES_PASSWORD: artisan_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artisan -d artisan_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers is used for module-level integration tests
      # (backend/test-support/PostgresTestContainer.java), but CI also runs
      # a plain service-container Postgres for the Flyway migration check
      # below, since that check runs outside the Maven reactor.
      - name: Build and test backend (Maven reactor)
        working-directory: backend
        run: mvn -B -f pom.xml verify

      - name: Verify Flyway migrations apply cleanly
        working-directory: database/migrations
        env:
          PGPASSWORD: artisan_dev_password
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          for f in $(ls V*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U artisan -d artisan_marketplace -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + type-check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test -- --ci --watchAll=false

  docker-build:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/app/Dockerfile
          push: false
          tags: artisan-platform-backend:ci
