name: Security scan

# Dependency and container vulnerability scanning. Runs on a schedule and on
# pushes to main, separately from CI so a new CVE disclosure can fail this
# workflow without blocking every PR's CI run.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  backend-dependency-scan:
    name: Backend dependency vulnerability scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run OWASP Dependency-Check
        working-directory: backend
        run: mvn -B -f pom.xml org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/**/target/dependency-check-report.html
          if-no-files-found: ignore

  frontend-audit:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # High/critical only — moderate-and-below findings are tracked but
      # don't fail the build, to avoid blocking on issues with no fix
      # available yet in transitive Expo/React Native dependencies.
      - name: npm audit (high + critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  container-scan:
    name: Backend image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/app/Dockerfile
          push: false
          load: true
          tags: artisan-platform-backend:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: artisan-platform-backend:scan
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: table
